# Generated by cue cmd genworkflows; do not edit

name: smoke test
"on":
  workflow_dispatch:
    inputs:
      version:
        description: 'The CUE version to install: an exact version, or latest'
        required: true
        default: latest
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use CUE
        id: install
        uses: ./
        with:
          version: ${{ inputs.version }}
      - name: Check cue on PATH is the one installed
        shell: bash
        env:
          CUE_PATH: ${{ steps.install.outputs.cue-path }}
          WANT: ${{ inputs.version }}
        run: |
          set -eu
          onpath=$(cue version)
          output=$("$CUE_PATH" version)
          echo "$onpath"
          test "$onpath" = "$output"
          if [ "$WANT" != latest ]; then
          	echo "$onpath" | head -n 1 | grep -Fx "cue version $WANT"
          fi
permissions:
  contents: read
